version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The lockfile pins macOS-only native binaries (lightningcss,
        # @tailwindcss/oxide). Remove it so npm resolves the correct
        # linux-x64 binaries for this build environment.
        - rm -rf node_modules package-lock.json
        - npm install
    build:
      commands:
        - echo "MEF_S3_BUCKET is set to [$MEF_S3_BUCKET]"
        - echo "MEF_DYNAMODB_TABLE is set to [$MEF_DYNAMODB_TABLE]"
        - echo "MEF_AWS_REGION is set to [$MEF_AWS_REGION]"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths: []
