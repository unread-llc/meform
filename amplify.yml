version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The lockfile pins macOS-only native binaries (lightningcss,
        # @tailwindcss/oxide). Remove it so npm resolves the correct
        # linux-x64 binaries for this build environment.
        - rm -rf node_modules package-lock.json
        - npm install
    build:
      commands:
        - echo "MEF_S3_BUCKET is set to [$MEF_S3_BUCKET]"
        - echo "MEF_DYNAMODB_TABLE is set to [$MEF_DYNAMODB_TABLE]"
        - echo "MEF_AWS_REGION is set to [$MEF_AWS_REGION]"
        - echo "NEXT_PUBLIC_APP_URL is set to [$NEXT_PUBLIC_APP_URL]"
        - echo "GOLOMT_TOKEN is set to [${GOLOMT_TOKEN:+yes}${GOLOMT_TOKEN:-no}]"
        - echo "GOLOMT_SECRET is set to [${GOLOMT_SECRET:+yes}${GOLOMT_SECRET:-no}]"
        # Write env vars to .env.production so they're available at SSR runtime
        - env | grep -E '^(GOLOMT_|PAYMENT_|SES_|MEF_|BYL_|NEXT_PUBLIC_|ADMIN_|RESEND_|CRON_)' >> .env.production
        - npm run build
        # Copy assets into .next so they're available at SSR runtime
        - cp -r assets .next/assets
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths: []
